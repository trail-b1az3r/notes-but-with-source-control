name: Release

# Run manually from the Actions tab. The workflow:
#   1. computes the next version (or uses the one you give it) and refuses to reuse an existing tag,
#   2. runs the unit tests,
#   3. archives the app and packages an .ipa (signed if signing secrets exist, otherwise unsigned),
#   4. creates the git tag and the GitHub Release, with release notes and the .ipa attached.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored if an explicit version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version, e.g. 1.2.0 (no leading "v")
        required: false
        type: string
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GITHUB_CLIENT_ID_VALUE: ${{ vars.NOTES_GITHUB_CLIENT_ID }}
      BUNDLE_ID: ${{ vars.NOTES_BUNDLE_ID || 'app.notes.Notes' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
            if [ -z "$LATEST" ]; then
              VERSION="1.0.0"
            else
              IFS=. read -r MAJ MIN PAT <<< "${LATEST#v}"
              case "$INPUT_BUMP" in
                major) VERSION="$((MAJ+1)).0.0" ;;
                minor) VERSION="$MAJ.$((MIN+1)).0" ;;
                *)     VERSION="$MAJ.$MIN.$((PAT+1))" ;;
              esac
            fi
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected MAJOR.MINOR.PATCH)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=${LATEST:-}" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Unit tests (NotesCore)
        run: swift test --package-path Packages/NotesCore

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Detect signing secrets
        id: sign
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      # ---------- Unsigned build (default) ----------
      - name: Archive (unsigned)
        if: steps.sign.outputs.signed != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild archive -project Notes.xcodeproj -scheme Notes -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Notes.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            APP_BUNDLE_ID="$BUNDLE_ID" GITHUB_CLIENT_ID="$GITHUB_CLIENT_ID_VALUE" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/Notes.xcarchive/Products/Applications/Notes.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../Notes-v$VERSION-unsigned.ipa" Payload)
          echo "IPA=build/Notes-v$VERSION-unsigned.ipa" >> "$GITHUB_ENV"

      # ---------- Signed build (when IOS_CERT_P12_BASE64 + IOS_PROFILE_BASE64 are set) ----------
      - name: Import certificate and provisioning profile
        if: steps.sign.outputs.signed == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" login.keychain-db
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PUUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PUUID.mobileprovision"
          { echo "PROFILE_NAME=$PNAME"; echo "TEAM_ID=$TEAM"; } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export (signed)
        if: steps.sign.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          EXPORT_METHOD: ${{ vars.NOTES_EXPORT_METHOD || 'ad-hoc' }}
          IDENTITY: ${{ vars.NOTES_SIGNING_IDENTITY || 'Apple Distribution' }}
        run: |
          set -euo pipefail
          xcodebuild archive -project Notes.xcodeproj -scheme Notes -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Notes.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            APP_BUNDLE_ID="$BUNDLE_ID" GITHUB_CLIENT_ID="$GITHUB_CLIENT_ID_VALUE" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Notes.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          cp build/export/*.ipa "build/Notes-v$VERSION.ipa"
          echo "IPA=build/Notes-v$VERSION.ipa" >> "$GITHUB_ENV"

      - name: Write release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          {
            echo "## Notes: v$VERSION"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed build. Install on a device included in the provisioning profile."
            else
              echo "**Unsigned build.** This .ipa is not signed and will not install directly. Re-sign it with your own Apple ID using a sideloading tool (e.g. AltStore or Sideloadly), or build from source in Xcode (see README)."
            fi
            echo
            if [ -n "$GITHUB_CLIENT_ID_VALUE" ]; then
              echo "GitHub sign-in is configured in this build."
            else
              echo "GitHub sign-in is **not configured** in this build (set the \`NOTES_GITHUB_CLIENT_ID\` repository variable). Local notes work regardless."
            fi
            echo
            echo "SHA-256: \`$(shasum -a 256 "$IPA" | cut -d' ' -f1)\`"
            echo
            echo "---"
            echo
          } > build/notes.md

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ARGS=(--target "$GITHUB_SHA" --title "Notes: $TAG" --notes-file build/notes.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "$IPA" "${ARGS[@]}"

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notes-${{ steps.v.outputs.tag }}-ipa
          path: build/*.ipa
